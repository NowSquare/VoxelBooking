name: Verify application and agent parity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contracts-and-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, gd, mbstring, openssl, pdo_mysql, sodium, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - name: Require a reviewed parity decision and a current rendered ledger
        run: php scripts/check-agent-parity.php --check-render
      - name: Require every user-facing string to go through translations
        run: python3 scripts/audit-i18n.py --include-api
      - name: Require canonical design tokens in every stylesheet
        run: python3 scripts/audit-css-tokens.py
      - name: Validate the generated v2 OpenAPI 3.1 document with an external validator
        run: |
          mkdir -p "$RUNNER_TEMP/agent-docs"
          php scripts/export-agent-docs.php "$RUNNER_TEMP/agent-docs"
          npx --yes @redocly/cli@2.57.0 lint --extends=spec --format=stylish "$RUNNER_TEMP/agent-docs/openapi.json"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Require committed production assets
        run: git diff --exit-code -- public/assets
  disposable-database:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            mysql: '8.0'
          - php: '8.5'
            mysql: '8.4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, gd, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, sodium, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Rehearse version 28 upgrade, interrupted DDL and backup recovery
        run: php scripts/test-isolated.php --upgrade-check --mysql-image=mysql:${{ matrix.mysql }}
      - name: Run only against a disposable database and isolated application
        run: php scripts/test-isolated.php --mysql-image=mysql:${{ matrix.mysql }} --log-junit "$RUNNER_TEMP/junit.xml"
      - name: Require every referenced parity test to have run and passed
        run: php scripts/check-agent-parity.php --junit="$RUNNER_TEMP/junit.xml"
      - name: Keep the complete JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php${{ matrix.php }}-mysql${{ matrix.mysql }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
